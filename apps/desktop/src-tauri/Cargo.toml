[package]
name = "ark-desktop"
version = "0.1.0"
description = "Ark · 方舟 桌面版 — 本地优先的 AI Agent 生产力工作台"
edition = "2021"

[lib]
name = "ark_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
