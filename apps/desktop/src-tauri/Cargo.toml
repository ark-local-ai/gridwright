[package]
name = "gridwright-desktop"
version = "0.1.2"
description = "gridwright 桌面版 — 本地数据管家：盯表、按规矩改表、每格改动留账"
edition = "2021"

[lib]
name = "gridwright_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
