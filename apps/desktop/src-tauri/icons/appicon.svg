<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- gridwright 应用图标 · 与桌面端设计语言一致：墨黑圆角底 + 微极光 + 白色 2×2 网格
       （网格 = 表/账目，呼应“每一格改动都留账目”） -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3644"/>
      <stop offset="1" stop-color="#161d27"/>
    </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="10%" r="62%">
      <stop offset="0" stop-color="#4a7fb5" stop-opacity="0.60"/>
      <stop offset="1" stop-color="#4a7fb5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="86%" cy="92%" r="58%">
      <stop offset="0" stop-color="#7a54a8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7a54a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="94%" cy="4%" r="44%">
      <stop offset="0" stop-color="#0f8a97" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#0f8a97" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tileClip"><rect width="512" height="512" rx="114"/></clipPath>
  </defs>
  <g clip-path="url(#tileClip)">
    <rect width="512" height="512" fill="url(#tile)"/>
    <rect width="512" height="512" fill="url(#glowA)"/>
    <rect width="512" height="512" fill="url(#glowB)"/>
    <rect width="512" height="512" fill="url(#glowC)"/>
  </g>
  <g fill="#ffffff">
    <rect x="116" y="116" width="124" height="124" rx="28"/>
    <rect x="272" y="116" width="124" height="124" rx="28"/>
    <rect x="116" y="272" width="124" height="124" rx="28"/>
    <rect x="272" y="272" width="124" height="124" rx="28"/>
  </g>
</svg>
